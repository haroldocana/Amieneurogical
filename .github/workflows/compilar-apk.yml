name: Compilar APK Centinela (Privado)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Construir Frontend React
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Capacitor
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Centinela" "com.amie.centinela" --web-dir "dist"
          npx cap add android

      - name: Compilar APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Centinela-JITAI
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
