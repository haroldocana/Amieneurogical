name: Compilar APK Centinela (Privado)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Aceptar Licencias de Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Construir Frontend React
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Generar Capa Nativa Android Limpia
        run: |
          cd frontend
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "Centinela" "com.amie.centinela" --web-dir "dist"
          npx cap add android

      - name: Inyectar Permisos y Telemetría Pasiva
        run: |
          cd frontend/android/app/src/main
          
          mkdir -p res/xml
          cat << 'EOF' > res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100" />
          EOF

          mkdir -p java/com/amie/centinela
          cat << 'EOF' > java/com/amie/centinela/SentinelTelemetryUploader.java
          package com.amie.centinela;
          import org.json.JSONObject;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class SentinelTelemetryUploader {
              public static void sendData(double averageLatencyMs) {
                  new Thread(() -> {
                      try {
                          URL url = new URL("https://amieneurogical-frontend.onrender.com/api/sentinel/telemetry");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json; charset=UTF-8");
                          conn.setDoOutput(true);

                          JSONObject payload = new JSONObject();
                          payload.put("patientId", "PAC-8104");
                          payload.put("typingLatencyMs", (int) averageLatencyMs);
                          payload.put("sleepHoursLastNight", 6.5);
                          payload.put("timestamp", System.currentTimeMillis());

                          try(OutputStream os = conn.getOutputStream()) {
                              byte[] input = payload.toString().getBytes("utf-8");
                              os.write(input, 0, input.length);
                          }
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {}
                  }).start();
              }
          }
          EOF

          cat << 'EOF' > java/com/amie/centinela/SentinelAccessibilityService.java
          package com.amie.centinela;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import java.util.ArrayList;
          import java.util.List;

          public class SentinelAccessibilityService extends AccessibilityService {
              private long lastKeyTimestamp = 0;
              private List<Long> latencyList = new ArrayList<>();

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event != null && event.getEventType() == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      long currentTime = System.currentTimeMillis();
                      if (lastKeyTimestamp != 0) {
                          long delta = currentTime - lastKeyTimestamp;
                          if (delta >= 50 && delta <= 2000) { latencyList.add(delta); }
                      }
                      lastKeyTimestamp = currentTime;

                      if (latencyList.size() >= 20) {
                          long sum = 0;
                          for (long l : latencyList) sum += l;
                          double avg = (double) sum / latencyList.size();
                          SentinelTelemetryUploader.sendData(avg);
                          latencyList.clear();
                      }
                  }
              }
              @Override
              public void onInterrupt() {}
          }
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.amie.centinela">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/AppTheme">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".SentinelAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Compilar APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Centinela-JITAI
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
